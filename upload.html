<!DOCTYPE html>
<title>Upload session recording</title>
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --paper:#F3F0E7; --paper-raised:#FFFFFF; --ink:#14231C; --ink-soft:#4B5A50; --ink-faint:#8B9289;
  --line:rgba(20,35,28,0.14); --signal:#00C389;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F2A20; --paper-raised:#163C2C; --ink:#F3F0E7; --ink-soft:#C9CDBE; --ink-faint:#8FA294;
    --line:rgba(243,240,231,0.14); --signal:#3DD9A6;
  }
}
:root[data-theme="dark"]{
  --paper:#0F2A20; --paper-raised:#163C2C; --ink:#F3F0E7; --ink-soft:#C9CDBE; --ink-faint:#8FA294;
  --line:rgba(243,240,231,0.14); --signal:#3DD9A6;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:1.5rem;margin:0 0 8px;}
.wrap{max-width:520px;margin:0 auto;padding:56px 24px;}
p.sub{font-size:0.9rem;color:var(--ink-soft);line-height:1.5;margin:0 0 28px;}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:28px;}
label{display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;}
.field{margin-bottom:18px;}
input[type="text"],input[type="file"],textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:0.9rem;outline:none;
}
textarea{min-height:70px;resize:vertical;}
input:focus,textarea:focus{border-color:var(--signal);}
button{
  font-family:'Inter',sans-serif;font-weight:600;font-size:0.9rem;border-radius:9px;padding:11px 20px;
  border:none;background:var(--signal);color:#08281c;cursor:pointer;width:100%;
}
.ok{background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;padding:32px;text-align:center;font-size:0.95rem;color:var(--ink);}
</style>

<div class="wrap">
  <h1>Upload a session recording</h1>
  <p class="sub">Internal tool — feeds the Session Concierge's post-session recap. One file per session; the title should match the agenda exactly so it can be matched up later.</p>
  <div class="card">
    <form name="session-recording" method="POST" data-netlify="true" enctype="multipart/form-data" action="/upload.html?done=1" id="rec-form">
      <input type="hidden" name="form-name" value="session-recording">
      <div class="field"><label for="sessionTitle">Session title</label><input type="text" id="sessionTitle" name="sessionTitle" placeholder="Exactly as it appears on the agenda" required></div>
      <div class="field"><label for="recording">Recording file</label><input type="file" id="recording" name="recording" accept="audio/*,video/*" required></div>
      <div class="field"><label for="notes">Notes (optional)</label><textarea id="notes" name="notes" placeholder="Anything useful for the summary — who spoke, key moments, etc."></textarea></div>
      <input type="hidden" name="recordingUrl" value="">
      <input type="hidden" name="source" value="manual-upload">
      <button type="submit">Upload</button>
    </form>
  </div>
</div>

<script>
if(location.search.indexOf('done=1') > -1){
  document.querySelector('.card').innerHTML = '<div class="ok">Uploaded — thanks. It\'ll be picked up for that session\'s recap.</div>';
}
</script>
